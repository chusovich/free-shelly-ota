# OTA profile: Shelly Duo Bulb Gen3. OTA-relevant data only (no pins, no flash addresses).
display_name: "Shelly Duo Bulb Gen3"
platform: esp32c3
update_id: DuoBulbG3      # name used by https://updates.shelly.cloud/update/<update_id>
app_ptn: app_0            # partition the manifest "app" part targets
app_slot_size: 0x280000   # app_0 @0x20000, app_1 @0x3a0000 (differs from PlugMG3!)
boot_min_version: "1.0.9"   # the Duo has the same main board as the Multicolor Bulb, where the installed loader was 1.0.3 after a return to stock; a value that is not higher is skipped (not logged on this bulb yet)
revision: 2   # counts changes of this profile: raise it when anything else in this file changes (see devices/profiles.lock)
