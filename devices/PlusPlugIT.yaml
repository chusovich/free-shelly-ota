# OTA profile for PlusPlugIT, generated from the official 2.0.1 package.
display_name: "Shelly Plus Plug IT"
platform: esp32
update_id: PlusPlugIT        # name used by https://updates.shelly.cloud/update/<update_id>
app_ptn: app_0
app_slot_size: 0x190000   # app_0 @0x10000
pt_offset: 0x8000   # partition table address (default 0x10000)
boot_min_version: "1.0.9"   # the default (one patch above the official loader) is skipped on a unit that already runs a newer loader; 1.0.9 is above every loader seen
revision: 1   # counts changes of this profile: raise it when anything else in this file changes (see devices/profiles.lock)
