# Night light that follows the sun, as the effect "Night (sun)" (UNTESTED on the bulb).
# Add to shelly-rgbcct-bulb-g3.yaml:
#   packages:
#     sun: !include daylight_sun.yaml     # provides the sun component and your coordinates (set daylight_lat / daylight_lon there)
#     night_sun: !include night_sun.yaml
# Needs the "bulb" light (platform rgbw_ct_table) in the main file.
# For the night light by fixed times use night.yaml (effect "Night (time)").
#
# While the effect is selected and the sun is lower than night_sun_elev degrees, the lamp is set once a minute to the colour temperature night_k at
# night_brightness. Above that nothing is changed. The default -4 degrees is the same value where "Daylight (sun)" starts, so the two effects
# hand over to each other without a gap. Choosing a colour or brightness by hand ends the effect.
#
# The main file uses gamma 1.0 (as the stock firmware), so 5 % is about 51 of 1023 steps and clearly visible. If you set gamma_correct back to 2.8, 5 %
# is below one step and the lamp stays DARK: then include dimrange.yaml as well or raise night_brightness to about 0.10.

substitutions:
  night_sun_elev: "-4"        # degrees: the night light is active below this sun height
  night_brightness: "0.05"
  night_k: "2700"
  night_step: "60s"
  night_fade: "3000"

light:
  - id: !extend bulb
    effects:
      - lambda:
          name: "Night (sun)"
          update_interval: ${night_step}
          lambda: |-
              if (!id(ha_time).now().is_valid()) { ESP_LOGW("night_sun", "time not valid yet, waiting for Home Assistant"); return; }
              const float elev = (float) id(ha_sun).elevation();
              if (elev >= ${night_sun_elev}) return;      // sun is up: leave the lamp alone
              auto call = id(bulb).turn_on();
              call.set_color_mode(esphome::light::ColorMode::COLOR_TEMPERATURE);
              call.set_color_temperature(1000000.0f / ${night_k});
              call.set_brightness(${night_brightness});
              call.set_transition_length(${night_fade});
              call.set_publish(false);
              call.set_save(false);
              call.perform();
