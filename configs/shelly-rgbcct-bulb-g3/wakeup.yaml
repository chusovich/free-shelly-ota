# Sunrise alarm for the Shelly Multicolor Bulb Gen3 (UNTESTED on the bulb).
# Add to shelly-rgbcct-bulb-g3.yaml:
#   packages:
#     wakeup: !include wakeup.yaml
# Needs the "bulb" light (platform rgbw_ct_table) and the time component "ha_time" (platform homeassistant) in the main file.
# Over wake_minutes the lamp goes from off through deep red and orange to warm white at full brightness. It starts at wake_cron
# (only while the switch "Wake alarm" is on), or at once with the button "Sunrise start". The button "Sunrise stop" ends it.
# While the sunrise runs it sets the lamp every wake_step_s seconds; switching the lamp off by hand does not stop it, use the stop button.
# The light has two exclusive modes: the first part of the sunrise is RGB (deep red -> amber), at wake_switch (share of the time) it changes to
# colour temperature and warms from 2700 K to wake_end_k. The change of mode is a small step in colour (RGB amber -> white LED), it cannot be blended.
# Colours and brightness are starting points to tune by eye.

substitutions:
  wake_minutes: "30"
  wake_step_s: "10"                       # seconds between two steps (each step fades over the same time)
  wake_switch: "0.65"                     # 0..1: share of the time after which the sunrise changes from RGB to colour temperature
  wake_end_k: "3500"                      # colour temperature in kelvin at the end of the sunrise (2700..6500)
  wake_cron: "0 30 6 * * MON-FRI"         # seconds minutes hours day-of-month month day-of-week; here Mon-Fri 06:30

time:
  - id: !extend ha_time
    on_time:
      - cron: ${wake_cron}
        then:
          - if:
              condition:
                switch.is_on: wake_enabled
              then:
                - script.execute: wake_sunrise

globals:
  - id: wake_p
    type: float
    restore_value: no
    initial_value: "0.0"

switch:
  - platform: template
    id: wake_enabled
    name: "Wake alarm"
    icon: "mdi:alarm"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

button:
  - platform: template
    name: "Sunrise start"
    on_press:
      - script.execute: wake_sunrise
  - platform: template
    name: "Sunrise stop"
    on_press:
      - script.stop: wake_sunrise

script:
  - id: wake_sunrise
    mode: restart
    then:
      - lambda: 'id(wake_p) = 0.0f;'
      - while:
          condition:
            lambda: 'return id(wake_p) < 1.0f;'
          then:
            - lambda: |-
                const float p = id(wake_p);
                const float sw = ${wake_switch};
                const float br = 0.02f + 0.98f * p * p;           // slow start, faster at the end
                auto call = id(bulb).turn_on();
                if (p < sw) {
                  // RGB: deep red -> amber
                  const float t = p / sw;
                  const float rgb_g = 20.0f + (140.0f - 20.0f) * t * t * (3.0f - 2.0f * t);
                  ESP_LOGD("wake", "p %.2f: rgb g %.0f, brightness %.2f", p, rgb_g, br);
                  call.set_color_mode(esphome::light::ColorMode::RGB);
                  call.set_rgb(1.0f, rgb_g / 255.0f, 0.0f);
                  call.set_color_brightness(1.0f);
                } else {
                  // colour temperature: 2700 K -> wake_end_k
                  const float t = (p - sw) / (1.0f - sw);
                  const float kelvin = 2700.0f + (${wake_end_k} - 2700.0f) * t;
                  ESP_LOGD("wake", "p %.2f: %.0f K, brightness %.2f", p, kelvin, br);
                  call.set_color_mode(esphome::light::ColorMode::COLOR_TEMPERATURE);
                  call.set_color_temperature(1000000.0f / kelvin);
                }
                call.set_brightness(br);
                call.set_transition_length((uint32_t) ((float) ${wake_step_s} * 1000.0f));
                call.perform();
                id(wake_p) += (float) ${wake_step_s} / ((float) ${wake_minutes} * 60.0f);
            - delay: !lambda 'return (uint32_t) (${wake_step_s}) * 1000;'
