# Dim range for the Shelly Multicolor Bulb Gen3 (UNTESTED on the bulb).
# Add to shelly-rgbcct-bulb-g3.yaml:
#   packages:
#     dimrange: !include dimrange.yaml
# Needs the outputs out_r, out_g, out_b, out_w4, out_w5 from the main file.
#
# Why: the LED driver has 10 bits (0..1023). The main file uses gamma_correct 1.0 (linear, like the stock firmware), so 1 % is already about 10 steps and this package
# is NOT needed for the night light any more. It matters if you set gamma_correct back to the ESPHome default 2.8: then a slider value below about 8 % gives an output
# below one step and rounds to ZERO (the lamp stays dark). With this package the lowest non-zero output is raised to dim_min_*, so small values are visible,
# and dim_max limits the top (e.g. to save power or heat). A value of exactly 0 stays off.
# Note: min_power / max_power act on the final outputs, i.e. also on the colour temperature table values, which is what you want for a floor and a ceiling.
# Do NOT use max_power to set the RGB white balance (use red_gain / green_gain / blue_gain of the light: they are not applied in colour temperature mode).
#
# dim_min is a fraction of the maximum LED current: 0.001 is one driver step, 0.002 two steps. Raise it if the lamp does not light at the
# lowest values, lower it if the lowest value is too bright. The white channel and the colour channels are separate because the driver
# runs them with different currents (see rgb_current / cw_current in the main file).

substitutions:
  dim_min_rgb: "0.002"
  dim_min_white: "0.002"
  dim_max: "1.0"              # 0..1, top of the range for all outputs

output:
  - id: !extend out_r
    min_power: ${dim_min_rgb}
    max_power: ${dim_max}
    zero_means_zero: true
  - id: !extend out_g
    min_power: ${dim_min_rgb}
    max_power: ${dim_max}
    zero_means_zero: true
  - id: !extend out_b
    min_power: ${dim_min_rgb}
    max_power: ${dim_max}
    zero_means_zero: true
  - id: !extend out_w4
    min_power: ${dim_min_white}
    max_power: ${dim_max}
    zero_means_zero: true
  - id: !extend out_w5
    min_power: ${dim_min_white}
    max_power: ${dim_max}
    zero_means_zero: true
