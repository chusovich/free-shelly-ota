# Over-temperature protection for the Shelly Multicolor Bulb Gen3 (UNTESTED on the bulb).
# Add to shelly-rgbcct-bulb-g3.yaml:
#   packages:
#     overtemp: !include overtemp.yaml
# Needs the outputs out_r, out_g, out_b, out_white and the light "bulb" from the main file.
#
# It reads the chip temperature of the ESP32-C3 (sensor "Chip temperature"). Above overtemp_warn the brightness of all LED
# outputs is reduced step by step (down to overtemp_min_factor at overtemp_off). At overtemp_off the light is switched off and
# stays dark until the chip has cooled below overtemp_rearm. Effects, scenes and the daylight scripts keep working on top of it,
# because the limit sits between the light and the LED driver outputs.
#
# IMPORTANT: this is the temperature of the chip, not of the LEDs or the driver. In a closed fixture the LEDs can be much hotter than the chip
# reads. The default limits are starting points: first look at "Chip temperature" in normal use (the stock firmware also uses the chip sensor
# for its over-temperature protection) and set the limits about 15-20 degC above what you see at full brightness in your fixture.

substitutions:
  overtemp_warn: "75"          # degC: start reducing the brightness
  overtemp_off: "90"           # degC: switch the light off
  overtemp_rearm: "80"         # degC: after a switch-off the light may be used again below this
  overtemp_min_factor: "0.3"   # brightness factor reached at overtemp_off (0..1)
  overtemp_interval: "10s"     # how often the chip temperature is read

globals:
  - id: ot_factor
    type: float
    restore_value: no
    initial_value: "1.0"
  - id: ot_tripped
    type: bool
    restore_value: no
    initial_value: "false"
  - id: ot_r
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: ot_g
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: ot_b
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: ot_w
    type: float
    restore_value: no
    initial_value: "0.0"

# The light writes to these outputs; they scale the level and pass it on to the real outputs of the main file.
output:
  - platform: template
    id: lim_r
    type: float
    write_action:
      - lambda: 'id(ot_r) = state; id(out_r).set_level(state * id(ot_factor));'
  - platform: template
    id: lim_g
    type: float
    write_action:
      - lambda: 'id(ot_g) = state; id(out_g).set_level(state * id(ot_factor));'
  - platform: template
    id: lim_b
    type: float
    write_action:
      - lambda: 'id(ot_b) = state; id(out_b).set_level(state * id(ot_factor));'
  - platform: template
    id: lim_w
    type: float
    write_action:
      - lambda: 'id(ot_w) = state; id(out_white).set_level(state * id(ot_factor));'

light:
  - id: !extend bulb
    red: lim_r
    green: lim_g
    blue: lim_b
    white: lim_w

sensor:
  - platform: internal_temperature
    id: chip_temp
    name: "Chip temperature"
    update_interval: ${overtemp_interval}
    entity_category: diagnostic
    filters:
      - median:
          window_size: 3
          send_every: 1
    on_value:
      - lambda: |-
          if (std::isnan(x)) return;
          const float warn = ${overtemp_warn}, off = ${overtemp_off}, rearm = ${overtemp_rearm}, minf = ${overtemp_min_factor};
          float f = 1.0f;
          if (id(ot_tripped)) {
            if (x < rearm) {
              id(ot_tripped) = false;
              ESP_LOGI("overtemp", "chip %.1f C: cooled down, light allowed again", x);
            } else {
              f = 0.0f;
            }
          } else if (x >= off) {
            id(ot_tripped) = true;
            f = 0.0f;
            ESP_LOGW("overtemp", "chip %.1f C: too hot, light switched off", x);
            id(bulb).turn_off().set_transition_length(2000).perform();
          }
          if (!id(ot_tripped)) {
            if (x > warn) {
              f = 1.0f - (1.0f - minf) * (x - warn) / (off - warn);
              if (f < minf) f = minf;
              ESP_LOGW("overtemp", "chip %.1f C: brightness limited to %.0f %%", x, f * 100.0f);
            }
          }
          if (f != id(ot_factor)) {
            id(ot_factor) = f;
            id(out_r).set_level(id(ot_r) * f);
            id(out_g).set_level(id(ot_g) * f);
            id(out_b).set_level(id(ot_b) * f);
            id(out_white).set_level(id(ot_w) * f);
          }

  - platform: template
    name: "Brightness limit"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:thermometer-alert"
    entity_category: diagnostic
    update_interval: ${overtemp_interval}
    lambda: 'return id(ot_factor) * 100.0f;'

binary_sensor:
  - platform: template
    name: "Overtemperature"
    device_class: problem
    entity_category: diagnostic
    lambda: 'return id(ot_tripped);'
